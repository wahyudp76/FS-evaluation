name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # v1.9.0: bangun ulang CSS Tailwind statis + minify app.js
      # (hapus ~100 KB Play CDN render-blocking; hemat ~35% ukuran JS)
      - name: Build CSS statis + minify JS
        run: |
          npm install --no-save tailwindcss@3.4.13 terser@5.39.0 --no-audit --no-fund
          ./node_modules/.bin/tailwindcss -i ./assets/tailwind.input.css -o ./assets/tailwind.css --minify
          ./node_modules/.bin/terser ./app.js -c -m -o ./app.min.js
          node --check ./app.min.js
          ls -la ./assets/tailwind.css ./app.min.js ./app.js
      # Hanya file yang dibutuhkan browser — tools/, *.md, .github tidak ikut ter-deploy
      - name: Stage deploy files
        run: |
          rm -rf .pages-stage
          mkdir -p .pages-stage/assets
          cp index.html app.js sw.js manifest.json .pages-stage/
          cp app.min.js .pages-stage/app.js
          cp assets/*.png assets/*.ico assets/*.svg assets/*.csv assets/*.css .pages-stage/assets/
          du -sh .pages-stage .pages-stage/assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-stage'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
